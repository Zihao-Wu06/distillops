[project]
name = "distillops"
version = "0.1.0"
description = "Black-box LLM distillation for any verifiable task: teacher API -> rejection sampling -> SFT -> eval -> GRPO. Example tasks: GSM8K math and generative recommendation."
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "openai>=1.45",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "tqdm>=4.66",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
# GPU-side training stack; installed only on the training box.
train = ["torch>=2.5", "transformers>=4.51", "trl>=0.20", "peft>=0.13", "datasets>=3.0", "accelerate>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["distillops", "tasks", "tasks.math", "tasks.rec", "tasks.pii"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
