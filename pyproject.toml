[project]
name = "distillops"
version = "0.1.0"
description = "Distil any LLM, hosted or local, into a small model you own: verified teacher answers -> SFT -> GRPO, for any task whose answers can be checked."
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Zihao Wu" }]
keywords = ["knowledge distillation", "large language models", "rejection sampling",
            "supervised fine-tuning", "reinforcement learning", "GRPO", "small language models"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.45",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "tqdm>=4.66",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
# GPU-side training stack; installed only on the training box.
train = ["torch>=2.5", "transformers>=4.51", "trl>=0.20", "peft>=0.13", "datasets>=3.0", "accelerate>=1.0"]

[project.scripts]
distillops = "distillops.cli:main"

[project.urls]
Homepage = "https://github.com/Zihao-Wu06/distillops"
Repository = "https://github.com/Zihao-Wu06/distillops"
Issues = "https://github.com/Zihao-Wu06/distillops/issues"
Models = "https://huggingface.co/Liquor-06"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The wheel is the framework only. The example tasks (tasks/), configs and scripts stay in the
# repository: run them from a clone, where `--task tasks.math.gsm8k:GSM8KTask` resolves.
[tool.hatch.build.targets.wheel]
packages = ["distillops"]

[tool.hatch.build.targets.sdist]
include = ["/distillops", "/README.md", "/LICENSE", "/CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
