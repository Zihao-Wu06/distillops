[project]
name = "distillops-vision"
version = "0.1.0"
description = "distillops extension: distil an API model that sees images into a small vision-language model."
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = [
    "distillops",          # the framework (install it first, e.g. pip install -e ../..)
    "pillow>=10.0",
]

[project.optional-dependencies]
train = ["distillops[train]", "torchvision",   # torchvision: video/image processors of some models (Qwen-VL)
         "trl>=0.20,<0.28"]                # GRPO: 0.28 removed APIs it uses (tested on GPU with 0.24)
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["distillops_vision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
