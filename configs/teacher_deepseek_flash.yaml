# DeepSeek API teacher (OpenAI-compatible). Prices are OFF-PEAK CNY per 1M tokens,
# peak hours (weekdays 09-12, 14-18 Beijing) cost 2x.
base_url: https://api.deepseek.com
model: deepseek-flash
api_key_env: DEEPSEEK_API_KEY
temperature: 0.7          # >0 so retries in rejection sampling give different answers
max_tokens: 600           # short analysis + answer line; thinking mode is OFF (see extra_body)
max_concurrency: 256      # price is per token, so more concurrency only finishes sooner
# Non-thinking mode: we want a short, controllable rationale written in the answer itself
# (long hidden chains are expensive and hard for small students to learn).
# Verify the exact switch name against DeepSeek's docs ("思考模式") before a large run.
extra_body:
  thinking:
    type: disabled
peak:                     # provider's peak-price hours; omit for providers without peak pricing
  windows: [[9, 12], [14, 18]]
  utc_offset_hours: 8       # Beijing time
  weekdays_only: true
price:
  input_cache_hit: 0.02
  input_cache_miss: 1.0
  output: 4.0
  peak_multiplier: 2.0
cache_path: cache/teacher_deepseek_flash.sqlite
