# GRPO on the small labelled pool (split rl), reward = entity F1 (partial credit), from the teacher-SFT model.
model: checkpoints/pii_0.6b_teacher/merged
output_dir: checkpoints/pii_0.6b_grpo
num_generations: 8
max_prompt_length: 768
max_completion_length: 384
temperature: 1.0
lr: 1.0e-6
beta: 0.0
epsilon: 0.2
loss_type: dapo
batch_size: 64            # completions per device step (shrinks to fit memory)
grad_accum: 4
max_steps: 200            # or set by --epochs
use_vllm: true
vllm_mode: colocate
vllm_gpu_memory_utilization: 0.3
lora: false
chat_template_kwargs:
  enable_thinking: false  # Qwen3: answer directly (templates without this option ignore it)
eval_every: 25
eval_examples: 300
logging_steps: 5
save_steps: 100
extra:
  epsilon_high: 0.28
