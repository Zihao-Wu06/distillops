# Teacher config template: copy it, fill in your provider, and pass it with --teacher.
# Any endpoint that speaks the OpenAI chat-completions API works (hosted APIs, vLLM, SGLang, ...).
base_url: https://api.example.com/v1     # the provider's OpenAI-compatible base URL
model: your-teacher-model                # the provider's model name
api_key_env: TEACHER_API_KEY             # environment variable that holds the API key (never put keys here)
temperature: 0.7                         # > 0 so retries in rejection sampling give different answers
max_tokens: 1024                         # per call
max_tokens_param: max_tokens             # OpenAI reasoning models: max_completion_tokens (and temperature: null)
max_concurrency: 32                      # parallel requests; raise it if the provider allows
timeout_s: 300                           # per request
max_retries: 6                           # network errors, timeouts, 408/409/429 and 5xx, with exponential backoff
extra_body: {}                           # provider-specific request options, passed through unchanged
cache_path: cache/teacher.sqlite         # local response cache: an identical request is never sent twice
