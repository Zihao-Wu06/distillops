name: tests

on:
  push:
    branches: [main, vision]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[train,dev]"
      - name: Unit tests (no GPU or network needed)
        run: python -m pytest -q

  vision:
    # its own job: the extension's `train` extra pins TRL below 0.25, and the core job keeps
    # testing the newest libraries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[train,dev]"
          pip install -e "extensions/vision[train,dev]"
          pip list 2>/dev/null | grep -i -E "^(torch|transformers|trl|peft|datasets|accelerate) "
      - name: Vision extension tests (tiny models built offline, CPU)
        run: python -m pytest -q extensions/vision/tests
