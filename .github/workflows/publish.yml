name: publish

# Push a tag that matches the version in pyproject.toml (e.g. v0.1.0) to publish to PyPI.
# Uses PyPI Trusted Publishing: no token is stored in the repository. One-time setup on pypi.org:
# add a "pending publisher" for project distillops, owner Zihao-Wu06, repository distillops,
# workflow publish.yml, environment pypi.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the tag matches the version
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match version $v in pyproject.toml"; exit 1; }
      - name: Make the README's links and images work on PyPI
        run: python .github/scripts/pypi_readme.py README.md "$GITHUB_REF_NAME"
      - name: Build and check
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
